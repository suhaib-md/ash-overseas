name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager` field pins pnpm,
      # and specifying both makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:d1
      - run: pnpm build
      # Fail only on high/critical advisories (a dev-only moderate esbuild advisory is known).
      - run: pnpm audit --audit-level=high --prod
